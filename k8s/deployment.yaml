apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: comfyui
  labels:
    app: comfyui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      # Use a GPU-enabled node pool (NVIDIA)
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
      - name: comfyui
        image: localhost:32000/comfyui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8188
          name: http
          protocol: TCP
        # Resource limits - adjust based on your GPU requirements
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"
          requests:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "2"
        # Environment variables
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: COMFYUI_MODELS_DIR
          value: "/app/comfyui/models"
        - name: COMFYUI_WEB_DIR
          value: "/app/comfyui/web"
        - name: COMFYUI_TEMP_DIR
          value: "/app/comfyui/temp"
        - name: COMFYUI_EXTRA_MODEL_PATHS
          value: "/app/comfyui/extra_model_paths"
        # Volume mounts for persistent storage
        volumeMounts:
        - name: models
          mountPath: /app/comfyui/models
        - name: web
          mountPath: /app/comfyui/web
        - name: temp
          mountPath: /app/comfyui/temp
        - name: extra-model-paths
          mountPath: /app/comfyui/extra_model_paths
      # Restart policy
      restartPolicy: Always
      # Volumes
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: comfyui-models-pvc
      - name: web
        persistentVolumeClaim:
          claimName: comfyui-web-pvc
      - name: temp
        persistentVolumeClaim:
          claimName: comfyui-temp-pvc
      - name: extra-model-paths
        persistentVolumeClaim:
          claimName: comfyui-extra-model-paths-pvc