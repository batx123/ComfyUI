# Models Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-models-pvc
  namespace: comfyui
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
  # StorageClass - adjust based on your cluster
  storageClassName: microk8s-hostpath

---
# Web Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-web-pvc
  namespace: comfyui
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: microk8s-hostpath

---
# Temp Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-temp-pvc
  namespace: comfyui
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: microk8s-hostpath

---
# Extra Model Paths Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-extra-model-paths-pvc
  namespace: comfyui
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi
  storageClassName: microk8s-hostpath
